name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/radar-production-smoke-range-metadata
      - fix/radar-import-smoke-contract
      - audit/radar-production-sample-profiling
      - ci/radar-sample-audit-configurable-run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keep semantic ESLint checks blocking while legacy formatting debt is handled separately.
      - name: Validate Radar production smoke script
        run: node --check scripts/radar-production-smoke.mjs

      - name: Validate Radar production sample audit script
        run: node --check scripts/radar-production-sample-audit.mjs

      - name: Lint
        run: >-
          bunx eslint . --rule 'prettier/prettier: off'

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
